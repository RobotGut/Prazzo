<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Prazzo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <div class="login-banner">
            <div class="brand">
                <i class="fa-solid fa-scale-balanced"></i>
                <span> <h2>Prazzo</h2></span>
            </div>
            <div class="banner-text">
                <h2>Gestão jurídica moderna e integrada.</h2>
                <p>Acesse seu painel para acompanhar processos, gerenciar clientes e controlar seus prazos em um só lugar.</p>
            </div>
        </div>

        <div class="login-card">
            <div class="login-header">
                <h1>Acessar Conta</h1>
                <p>Insira suas credenciais para continuar</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">E-mail Profissional</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="loginEmail" class="form-control" placeholder="seu.email@adv.oab.br" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Senha</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Lembrar de mim</span>
                    </label>
                    <a href="#" class="forgot-password" onclick="alert('Instruções de recuperação enviadas para o e-mail cadastrado.')">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Entrar no Sistema <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <p>Ainda não tem uma conta? <a href="#" onclick="alert('Entre em contato com o suporte para criar seu acesso.')">Solicitar acesso</a></p>
            </div>
        </div>
    </main>

<script src="script.js"></script>
</body>
</html>
